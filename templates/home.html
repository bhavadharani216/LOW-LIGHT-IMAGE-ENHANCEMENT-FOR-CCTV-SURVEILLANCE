<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Low Light Enhancement</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top, #1e293b, #0f172a);
            color: white;
        }

        .container {
            text-align: center;
        }

        h1 {
            font-size: 40px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 40px;
        }

        .start-btn {
            padding: 15px 35px;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        .start-btn:hover {
            transform: scale(1.1);
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Low-Light Image Enhancement for CCTV Surveillance</h1>

    <a href="/app">
        <button class="start-btn">Start Project →</button>
    </a>
</div>

</body>
</html>
